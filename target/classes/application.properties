spring.application.name=restaurant-queue
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_queue?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:restaurant_app}
spring.datasource.password=${DB_PASSWORD:restaurant_app_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false